<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f4"><meta name="description" content="서울 지하철역 방문과 추억을 기록하는 나만의 일기장">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./assets/style.css">
  <title>Station Diary</title>
</head>
<body>
  <header class="top"><a class="brand" href="#">Station Diary<span>MY SUBWAY MEMORIES</span></a><button id="install" class="quiet" hidden>앱 설치</button></header>
  <main>
    <section class="hero"><p class="eyebrow">MY SUBWAY MEMORIES</p><h1>지나온 역에<br>나만의 이야기를.</h1><p>방문한 역과 그날의 기억을 기록해 보세요.<br>기록은 이 기기에만 저장됩니다.</p></section>
    <section class="summary"><div><span>방문한 역</span><strong id="count">0</strong></div><div><span>전체 역</span><strong id="total">—</strong></div><div class="progress"><div id="bar"></div></div><p id="percent">0% 기록했어요</p></section>
    <section class="tools"><input id="search" type="search" placeholder="역 이름으로 찾기" aria-label="역 검색"><select id="line" aria-label="호선 선택"><option value="">전체 호선</option></select><button id="export" class="quiet">기록 백업</button><label class="quiet import">백업 불러오기<input id="import" type="file" accept="application/json"></label></section>
    <div class="section-heading"><h2>역 목록</h2><span id="shown"></span></div><div id="stations" class="stations"></div>
    <footer>기록은 브라우저의 이 기기에 저장됩니다. 브라우저 데이터 삭제 시 사라질 수 있으니 가끔 백업해 주세요.</footer>
  </main>
  <dialog id="editor"><form method="dialog" id="entry-form"><button class="close" aria-label="닫기">×</button><p class="eyebrow">MY STATION DIARY</p><h2 id="station-title"></h2><label class="check"><input id="visited" type="checkbox"> 이 역에 방문했어요</label><label>방문 날짜<input id="date" type="date"></label><label>오늘의 메모<textarea id="note" rows="5" placeholder="그날의 기억을 적어 보세요"></textarea></label><div class="actions"><button type="button" id="clear" class="quiet">기록 지우기</button><button id="save" class="primary">저장</button></div></form></dialog>
  <script src="./assets/app.js" defer></script>
</body></html>
