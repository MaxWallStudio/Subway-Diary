<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 - Station Diary</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🚇
            </div>

            <h1>
                Station Diary
            </h1>

            <p>
                나의 지하철 기록을 이어가세요.
            </p>

        </div>

        {% if account_deleted %}
        <p class="auth-success" role="status">계정과 저장된 개인정보를 삭제했습니다.</p>
        {% endif %}


        <form method="POST" class="auth-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label>
                아이디
            </label>

            <input
                type="text"
                name="username"
                autocomplete="username"
                required
            >


            <label>
                비밀번호
            </label>

            <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
            >


            {% if error %}

            <p class="auth-error">
                {{ error }}
            </p>

            {% endif %}


            <button type="submit">
                로그인
            </button>

        </form>


        <div class="auth-footer">

            <span>
                아직 계정이 없나요?
            </span>

            <a href="{{ url_for('register') }}">
                회원가입
            </a>

        </div>

    </div>

</main>

</body>

</html>
