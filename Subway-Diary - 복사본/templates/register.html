<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입 - Station Diary</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<main class="auth-page">

    <div class="auth-card">


        <div class="auth-header">

            <div class="auth-icon">
                🚇
            </div>

            <h1>
                Station Diary
            </h1>

            <p>
                나만의 지하철 기록을 시작하세요.
            </p>

        </div>


        <form method="POST" class="auth-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label>
                아이디
            </label>

            <input
                type="text"
                name="username"
                autocomplete="username"
                minlength="3"
                required
            >


            <label>
                비밀번호
            </label>

            <input
                type="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
            >


            {% if error %}

            <p class="auth-error">
                {{ error }}
            </p>

            {% endif %}


            <!-- 개인정보 동의 -->

            <div class="privacy-agreement">

                <label>

                    <input
                        type="checkbox"
                        name="privacy_agree"
                        required
                    >

                    <span>
                        개인정보 처리방침에 동의합니다.
                    </span>

                </label>

                <a href="{{ url_for('privacy') }}">
                    내용 보기
                </a>

            </div>


            <button type="submit">
                회원가입
            </button>


        </form>


        <div class="auth-footer">

            <span>
                이미 계정이 있나요?
            </span>

            <a href="{{ url_for('login') }}">
                로그인
            </a>

        </div>


    </div>

</main>


</body>

</html>
